<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7ffd0"/>
      <stop offset="50%" stop-color="#62f6aa"/>
      <stop offset="100%" stop-color="#0d5c36"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#62f6aa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d5c36" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGlow)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="0"/>
  
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#62f6aa" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="800 400"/>
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00ffff" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="200 600"/>
  
  <!-- Core -->
  <circle cx="256" cy="256" r="60" fill="url(#coreGlow)"/>
  
  <!-- Core highlight -->
  <circle cx="240" cy="240" r="18" fill="#a7ffd0" opacity="0.9"/>
  
  <!-- ZARA text -->
  <text x="256" y="380" font-family="Orbitron, monospace" font-size="48" font-weight="700" fill="#e7fff0" text-anchor="middle" letter-spacing="8">ZARA</text>
  <text x="256" y="420" font-family="Space Grotesk, sans-serif" font-size="16" fill="#62f6aa" text-anchor="middle" letter-spacing="4">NEURAL INTERFACE v3.0</text>
  
  <!-- Circuit lines -->
  <g stroke="#62f6aa" stroke-width="1.5" opacity="0.5">
    <line x1="256" y1="60" x2="256" y2="100"/>
    <line x1="256" y1="412" x2="256" y2="452"/>
    <line x1="60" y1="256" x2="100" y2="256"/>
    <line x1="412" y1="256" x2="452" y2="256"/>
    <line x1="120" y1="120" x2="155" y2="155"/>
    <line x1="357" y1="357" x2="392" y2="392"/>
    <line x1="120" y1="392" x2="155" y2="357"/>
    <line x1="357" y1="155" x2="392" y2="120"/>
  </g>
  
  <!-- Corner brackets -->
  <g stroke="#62f6aa" stroke-width="3" fill="none" opacity="0.7">
    <path d="M80 80 L80 120 M80 80 L120 80"/>
    <path d="M432 80 L432 120 M432 80 L392 80"/>
    <path d="M80 432 L80 392 M80 432 L120 432"/>
    <path d="M432 432 L432 392 M432 432 L392 432"/>
  </g>
</svg>

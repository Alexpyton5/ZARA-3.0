<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 200" role="img" aria-label="ZA">
  <defs>
    <!-- Gradiente vertical da referência: topo esmeralda médio-claro, base escura -->
    <linearGradient id="za-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dbd9b"/>
      <stop offset="0.3" stop-color="#2a8f70"/>
      <stop offset="0.6" stop-color="#16513f"/>
      <stop offset="0.85" stop-color="#0c352a"/>
      <stop offset="1" stop-color="#08231b"/>
    </linearGradient>
    <!-- Brilho de borda (topo iluminado) -->
    <linearGradient id="za-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9df2d0" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#55c2a0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#08231b" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <g fill="url(#za-face)" stroke="url(#za-edge)" stroke-width="2">
    <!-- Z: barra superior (espessa) -->
    <path d="M8 16 H132 V52 H8 Z"/>
    <!-- Z: diagonal espessa -->
    <path d="M132 52 H88 L8 148 H52 Z"/>
    <!-- Z: barra inferior — avança para dentro da perna do A (interlock) -->
    <path d="M8 148 H146 V184 H8 Z"/>
    <!-- A: triângulo externo menos o contra interno (evenodd) -->
    <path fill-rule="evenodd" d="M212 8 L306 192 H118 Z M212 74 L262 168 H162 Z"/>
    <!-- A: barra transversal espessa — ultrapassa a perna esquerda como na referência -->
    <path d="M126 112 H265 L284 148 H114 Z"/>
    <!-- A: triângulo sólido abaixo da barra -->
    <path d="M212 154 L246 192 H178 Z"/>
  </g>
</svg>

[project]
name = "zara-3.0"
version = "3.0.0"
description = "ZARA 3.0 - Next-Gen JARVIS Neural Interface"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alex", email = "alex@zara.local"}]
keywords = ["assistant", "ai", "jarvis", "voice", "neural", "hermes", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Desktop Environment",
]
dependencies = [
    "httpx>=0.27.0",
    "google-genai>=2.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pydantic-core>=2.20.0",
    "python-dotenv>=1.0.0",
    "watchdog>=3.0.0",
    "vosk>=0.3.45",
    "faster-whisper==1.2.1",
    "pvporcupine>=3.0.0",
    "kokoro-onnx>=0.3.0",
    "sounddevice>=0.4.6",
    "pycaw>=20240210",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0",
    "pyperclip>=1.8.2",
    "mss>=9.0.1",
    "pyautogui==0.9.54",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.9.0", "pyinstaller>=6.5.0"]

[project.scripts]
zara = "main:main"
zara-build = "build_exe:build"

[tool.uv]
dev-dependencies = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.9.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "safe: sem efeitos colaterais reais (fake stores, paths temporarios)",
    "sandbox: roda em sandbox isolado",
    "live: toca integracoes reais (deselecionado por padrao via -m 'not live')",
    "real_env: precisa do ambiente real da maquina (fora do isolamento de dados)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
per-file-ignores = { "build_exe.py" = ["S603", "S607"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
